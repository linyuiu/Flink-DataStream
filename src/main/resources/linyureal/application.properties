# Pass an external properties file as the first program argument to override any value.
kafka.bootstrap.servers=localhost:9094
kafka.topic.partitions=3
kafka.topic.replication.factor=1
# Demo only: unbounded retained history. Production requires archive/rebuild and capacity policies.
kafka.topic.retention.ms=-1
topic.trade_order=lr.ods.trade_order
topic.trade_order_item=lr.ods.trade_order_item
topic.trade_payment=lr.ods.trade_payment
topic.trade_payment_item=lr.ods.trade_payment_item
topic.trade_refund=lr.ods.trade_refund
topic.trade_refund_item=lr.ods.trade_refund_item
topic.payment_fact=lr.dwd.payment_item
topic.refund_fact=lr.dwd.refund_item
topic.dirty=lr.dlq.trade
topic.dim_product=lr.ods.dim_product
topic.dim_sku=lr.ods.dim_sku
topic.dim_category=lr.ods.dim_category
topic.dim_shop=lr.ods.dim_shop
topic.dim_brand=lr.ods.dim_brand
topic.dim_region=lr.ods.dim_region
group.dimensions=lr-dimensions-v1
doris.table.dimensions=linyureal.dim_catalog
group.trade=lr-trade-v1
group.metrics=lr-metrics-v1
kafka.transaction.prefix=lr-dev-v1
kafka.transaction.timeout.ms=600000
flink.parallelism=1
checkpoint.interval.ms=5000
checkpoint.timeout.ms=120000
# Local development only. In a cluster, mount the SAME durable volume on all Flink processes.
checkpoint.directory=file:///tmp/linyureal-checkpoints
join.audit.interval.ms=300000
output.interval.ms=5000
doris.fenodes=localhost:8030
doris.username=root
doris.table.metrics=linyureal.ads_gmv_dimension_day
doris.table.facts=linyureal.dwd_money_item_fact
doris.label.prefix=lr_dev_v1
mock.mode=kafka
mock.run.id=demo001
mock.order.count=80
mock.orders.per.second=5
mock.seed=2026
mock.duplicate.rate=0.10
mock.shuffle.rate=0.20
mysql.url=jdbc:mysql://localhost:3307/linyureal?serverTimezone=Asia/Shanghai
mysql.username=root
# Secrets ONLY via LINYUREAL_MYSQL_PASSWORD and LINYUREAL_DORIS_PASSWORD.
