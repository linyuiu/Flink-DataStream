# Capacity proposal only; replace network/storage placeholders and prove via representative load tests.
deployment.environment=production
pipeline.mode=split
mysql.host=REPLACE_MYSQL_CDC_ENDPOINT
mysql.port=3306
kafka.bootstrap.servers=REPLACE_KAFKA_BROKERS
kafka.partitions=32
kafka.replicas=3
kafka.min.insync.replicas=2
# 分拆任务slot预算：4+4+8+8+2+2=28个运行slot；备用容量按最大TM故障和发布方式计算。
# slot不是固定的CPU/内存单位；建议按Job拆Application Cluster或使用资源配置隔离。
parallelism.cdc=4
# 仅pipeline.mode=integrated使用；split模式不提交CommerceMetricsJob。
parallelism.metrics=16
parallelism.dimensions=2
parallelism.doris=8
checkpoint.directory=s3://REPLACE_CHECKPOINT_BUCKET/commerce/v1
kafka.transaction.prefix=commerce-prod-v1
doris.fenodes=REPLACE_DORIS_FE:8030
doris.label.prefix=commerce_prod_v1
# Shard counts deliberately unchanged from local: changing them needs an isolated rebuild/cutover.
# Before creating Doris tables change replication_num to 3 and review bucket counts/partition lifecycle.
parallelism.facts=4
parallelism.amounts=8
parallelism.distincts=8
parallelism.audit=2
# 容量起点（不是Flink配置项）：
# CDC 1 vCPU + 2-4GiB/slot；facts 1 vCPU + 4-8GiB/slot；
# amounts/distincts 1-2 vCPU + 8-12GiB/slot；audit 1 vCPU + 2-4GiB/slot；
# dimensions 1 vCPU + 4-8GiB/slot。详细CK区间与公式见JOB_SPLIT_CHECKPOINT_DESIGN.md。
