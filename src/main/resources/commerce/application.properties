# Safe local defaults. Production overrides are proposals requiring load tests.
deployment.environment=local
pipeline.mode=split
recovery.budget.ms=120000
mysql.host=localhost
mysql.port=3308
mysql.database=commerce
cdc.username=commerce_cdc
cdc.server.ids=7100-7115
cdc.snapshot.chunk.size=8096
mock.jdbc.url=jdbc:mysql://localhost:3308/commerce?serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
mock.jdbc.username=root
mock.run.id=commerce001
mock.orders=1000
mock.orders.per.second=10
# 可选：同时给两个独立模拟器设置相同的业务起始时间（epoch毫秒），使分别运行生成的时间戳也相同。
# mock.start.time.ms=1789956000000
mock.workers=2
mock.seed=20260914
mock.scenario=PROFILE
# Provisional interpretation: 1M created orders/day, 20% paid, paid goods AOV approx 27.40 yuan.
business.payment.rate=0.20
business.average.paid.cent=2740
capacity.orders.per.day=1000000
capacity.annual.gmv.yuan=2000000000
capacity.peak.factor=50
kafka.bootstrap.servers=localhost:9094
kafka.partitions=4
kafka.replicas=1
kafka.min.insync.replicas=1
kafka.data.retention.ms=1209600000
kafka.repair.retention.ms=7776000000
kafka.transaction.timeout.ms=900000
kafka.transaction.prefix=commerce-local-v1
topic.trade_outbox=commerce.ods.trade_outbox
topic.dim_product=commerce.ods.dim_product
topic.dim_sku=commerce.ods.dim_sku
topic.dim_category=commerce.ods.dim_category
topic.dim_brand=commerce.ods.dim_brand
topic.dim_shop=commerce.ods.dim_shop
topic.dim_region=commerce.ods.dim_region
topic.quality=commerce.quality
topic.repair=commerce.repair
group.metrics=commerce-metrics-v1
group.dimensions=commerce-dimensions-v1
parallelism.cdc=1
parallelism.metrics=2
parallelism.dimensions=1
parallelism.doris=1
flink.max.parallelism=128
checkpoint.interval.ms=10000
checkpoint.timeout.ms=120000
checkpoint.directory=file:///tmp/commerce-checkpoints
flush.interval.ms=3000
online.event.days=7
online.metric.days=93
shards.global=32
shards.dimensions=8
shards.entities=4
doris.fenodes=localhost:8030
doris.username=root
doris.table.partials=commerce.metric_partial
doris.table.events=commerce.trade_event
doris.table.dimensions=commerce.dim_catalog
doris.label.prefix=commerce_local_v1
# Secrets: COMMERCE_MYSQL_PASSWORD / COMMERCE_CDC_PASSWORD / COMMERCE_DORIS_PASSWORD

# Split deployment: facts, amounts, distincts and audit run as separate jobs.
topic.trade_fact=commerce.dwd.trade_fact.v2
topic.split_quality=commerce.quality.v2
topic.split_repair=commerce.repair.v2
group.facts=commerce-facts-v2
group.amounts=commerce-amounts-v2
group.distincts=commerce-distincts-v2
group.audit=commerce-audit-v2
parallelism.facts=1
parallelism.amounts=2
parallelism.distincts=1
parallelism.audit=1
checkpoint.facts.interval.ms=10000
checkpoint.amounts.interval.ms=10000
checkpoint.distincts.interval.ms=30000
checkpoint.audit.interval.ms=60000
online.distinct.metric.days=9
doris.table.amounts=commerce.metric_amount_partial
doris.table.distincts=commerce.metric_distinct_partial
